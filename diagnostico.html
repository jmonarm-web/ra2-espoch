<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico HIRO</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
body{margin:0;overflow:hidden;font-family:Arial}
#s{position:fixed;z-index:10;top:8px;left:8px;right:8px;background:#fff;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div id="s"><b>DIAGNÓSTICO:</b> si HIRO es detectado, debe aparecer un cubo azul con un aro girando.</div>
<a-scene embedded vr-mode-ui="enabled:false"
 arjs="sourceType:webcam;sourceWidth:640;sourceHeight:480;displayWidth:640;displayHeight:480;debugUIEnabled:false;detectionMode:mono;">
 <a-marker preset="hiro">
   <a-box position="0 0.5 0" material="color:#2878D0;opacity:.75;side:double">
     <a-torus-knot radius="0.23" radius-tubular="0.045"
       animation="property:rotation;to:360 0 0;dur:4000;easing:linear;loop:true"></a-torus-knot>
   </a-box>
 </a-marker>
 <a-entity camera></a-entity>
</a-scene>
</body>
</html>
